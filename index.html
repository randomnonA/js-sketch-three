<!DOCTYPE html>
<html lang="en-US">
  
  <head>
    <title>Untitled</title>
    <style>
    #rhombus {
    border-radius: 0%;
      height: 190px;
      width: 190px;
      position: relative;
      background: cyan;
      box-shadow: 90px 50px #123456;
      transform: rotate(45deg);
      }
      
      body {
       background-color: #FAD4C0; 
      }
    border-radius: </style>
  </head>
  <body>
    <div id="rhombus">
    </div>
    <script>
      let nameObj = "rhombus" //global variable string
      let speed = 100; //number global var
      let moving = true; //boolean global variable
      let x = 700;
      let y = 200;
      let dx = speed;
      let dy = speed;
      function moveShape() {
        if (moving) {
          x += dx;
          y += dy;
          if (x > window.innerWidth - 50 || x < 0) {
            dx = -dx;
          }
          
          if (y > window.innerHeight - 50 || y < 0) {
            dy = -dy;
          }
          rhombus.style.left = x + "px";
          rhombus.style.top = y + "px";
        }
      }
      
      function showInfo() {
        console.log(nameObj, speed, moving);
      }
      showInfo();
      
      setInterval(moveShape, 1);
    </script>
  </body>
</html>
